<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />

  <title>Clizco · Abraham Gonzalez — Full Stack Developer</title>
  <meta name="description" content="Clizco, Full Stack Developer en España. Construyo plataformas web, APIs, apps y soluciones con IA que funcionan en producción." />
  <meta property="og:title" content="Clizco · Abraham Gonzalez — Full Stack Developer" />
  <meta property="og:description" content="Plataformas web, APIs, apps y soluciones con IA que funcionan en producción." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://clizco.github.io/" />

  <meta property="og:image:width" content="1200" />

  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="img/icono.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0c;
      --bg-2: #101013;
      --card: #16161a;
      --card-2: #1e1e24;
      --line: #2e2e36;
      --text: #f3f2ee;
      --muted: #a3a2a8;
      --red: #e02a22;
      --red-hi: #ff4a3d;
      --shield: #39d0ff;
      --legendary: #ffb81c;
      --epic: #b768ff;
      --rare: #45acff;
      --green: #7ee05a;
      /* colores usados por los datos */
      --teal: var(--shield); --coral: var(--red-hi); --amber: var(--legendary); --lime: var(--green); --blue: var(--rare);
      --k: 14px;
      --max: 1200px;
      --display: "Barlow Condensed", Impact, sans-serif;
      --hud: "Chakra Petch", system-ui, sans-serif;
      --sans: "Barlow", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 84px; }
    body { font-family: var(--sans); font-size: 17px; background: var(--bg); color: var(--text); line-height: 1.55; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: repeating-linear-gradient(115deg, rgba(255,255,255,.012) 0 2px, transparent 2px 14px); }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    ul { list-style: none; }
    .wrap { width: min(var(--max), 100% - 32px); margin-inline: auto; }
    .mono { font-family: var(--mono); }
    :focus-visible { outline: 2px solid var(--shield); outline-offset: 2px; }
    .cut { clip-path: polygon(var(--k) 0, 100% 0, 100% calc(100% - var(--k)), calc(100% - var(--k)) 100%, 0 100%, 0 var(--k)); }

    /* ---------- NAV ---------- */
    .nav { position: sticky; top: 0; z-index: 60; background: rgba(10,10,12,.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .nav .wrap { display: flex; align-items: center; gap: 22px; height: 66px; }
    .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1.45rem; letter-spacing: .3px; text-transform: uppercase; white-space: nowrap; }
    .menu { display: flex; gap: 4px; margin-left: auto; font-family: var(--hud); font-weight: 600; font-size: .86rem; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
    .menu a { padding: 8px 14px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); transition: color .15s, background .15s; }
    .menu a:hover { color: var(--text); background: var(--card-2); }
    .lang { display: flex; font-family: var(--hud); font-size: .78rem; font-weight: 700; border: 1px solid var(--line); }
    .lang button { padding: 5px 10px; color: var(--muted); }
    .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .burger { display: none; width: 42px; height: 42px; border: 1px solid var(--line); place-items: center; }
    .burger span, .burger span::before, .burger span::after { display: block; width: 18px; height: 2px; background: var(--text); position: relative; transition: transform .2s, background .2s; }
    .burger span::before, .burger span::after { content: ""; position: absolute; left: 0; }
    .burger span::before { top: -6px; } .burger span::after { top: 6px; }
    .nav.open .burger span { background: transparent; }
    .nav.open .burger span::before { transform: translateY(6px) rotate(45deg); }
    .nav.open .burger span::after { transform: translateY(-6px) rotate(-45deg); }
    /* barra de progreso de scroll en forma de celdas de escudo */
    .shield-bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--shield); transform-origin: left; transform: scaleX(0); -webkit-mask: repeating-linear-gradient(90deg, #000 0 42px, transparent 42px 46px); mask: repeating-linear-gradient(90deg, #000 0 42px, transparent 42px 46px); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 26px; font-family: var(--hud); font-weight: 700; font-size: .92rem; letter-spacing: .6px; text-transform: uppercase; white-space: nowrap; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); transition: background .15s, color .15s, transform .15s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-primary:hover { background: var(--red-hi); }
    .btn-ghost { background: var(--card-2); }
    .btn-ghost:hover { background: var(--text); color: var(--bg); }
    .btn-sm { padding: 9px 20px; font-size: .8rem; }

    @media (max-width: 900px) {
      .menu { position: fixed; inset: 66px 0 auto 0; flex-direction: column; gap: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 16px 18px; transform: translateY(-130%); transition: transform .25s; z-index: -1; }
      .menu a { padding: 14px 4px; border-bottom: 1px solid var(--line); color: var(--text); clip-path: none; font-size: 1rem; }
      .nav.open .menu { transform: none; }
      .burger { display: grid; }
      .lang { margin-left: auto; }
      .nav-cta { display: none; }
    }

    /* ---------- HERO ---------- */
    .hero { position: relative; padding: 72px 0 64px; overflow: hidden; isolation: isolate; }
    .hero::before { content: ""; position: absolute; z-index: -2; top: -20%; right: -8%; width: 58%; height: 150%; background: linear-gradient(160deg, var(--red) 0%, #7a120e 45%, transparent 85%); transform: skewX(-14deg); opacity: .72; }
    .hero::after { content: ""; position: absolute; z-index: -1; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 4px); pointer-events: none; }
    .hero .wrap { display: grid; grid-template-columns: 1.08fr .92fr; gap: 52px; align-items: center; }
    .status { display: inline-flex; align-items: center; gap: 10px; font-family: var(--hud); font-weight: 600; font-size: .8rem; letter-spacing: .8px; text-transform: uppercase; background: var(--card-2); padding: 7px 18px 7px 14px; margin-bottom: 22px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
    .pulse { width: 9px; height: 9px; background: var(--green); transform: rotate(45deg); animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    h1 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: clamp(3.3rem, 8.4vw, 6.6rem); line-height: .88; letter-spacing: -.5px; text-transform: uppercase; }
    h1 .hl { color: var(--red-hi); display: block; }
    .hero-sub { color: #cfced2; font-size: 1.14rem; margin: 24px 0 30px; max-width: 540px; }
    .hero-sub strong { color: var(--text); font-weight: 600; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .op { background: rgba(16,16,19,.94); border: 1px solid var(--line); --k: 22px; }
    .op-top { display: grid; grid-template-columns: 92px 1fr; gap: 18px; padding: 24px 24px 18px; align-items: center; }
    .op-emblem { width: 92px; height: 104px; display: grid; place-items: center; background: linear-gradient(150deg, var(--red-hi), #7a120e); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); font-family: var(--display); font-style: italic; font-weight: 800; font-size: 2.7rem; }
    .op-emblem img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .op-label { font-family: var(--hud); font-size: .72rem; letter-spacing: 1.2px; color: var(--red-hi); font-weight: 700; text-transform: uppercase; }
    .op-name { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 2.3rem; line-height: 1; text-transform: uppercase; margin: 2px 0 4px; }
    .op-class { color: var(--muted); font-size: .93rem; }
    .op-real { font-family: var(--hud); font-weight: 700; font-size: .84rem; letter-spacing: .6px; margin-bottom: 4px; }
    .op-firma { border-top: 1px solid var(--line); padding: 14px 24px 16px; display: flex; justify-content: center; }
    .op-firma .firma { width: min(270px, 100%); }
    .firma svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 0 12px rgba(255,90,40,.5)); }
    .firma .draw path { fill: none; stroke: #fff; stroke-width: 44; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; }
    .firma.in .draw path { animation: firmaTrazo var(--t) var(--d) cubic-bezier(.45,.05,.55,.95) forwards; }
    .firma .chispa { transform-box: fill-box; transform-origin: center; transform: scale(0); }
    .firma.in .chispa { animation: firmaChispa .5s 2.05s cubic-bezier(.2,1.6,.4,1) forwards; }
    .firma.in svg { animation: firmaBrillo 1.1s 2.05s ease-out; }
    @keyframes firmaTrazo { to { stroke-dashoffset: 0; } }
    @keyframes firmaChispa { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
    @keyframes firmaBrillo { 25% { filter: drop-shadow(0 0 30px rgba(255,150,40,1)) brightness(1.35); } }
    @media (prefers-reduced-motion: reduce) { .firma .draw path { stroke-dashoffset: 0; } .firma .chispa { transform: none; } .firma.in .draw path, .firma.in .chispa, .firma.in svg { animation: none; } }
    .about-firma { margin-top: 26px; display: grid; gap: 8px; justify-items: start; }
    .about-firma .firma { width: min(540px, 100%); }
    .about-firma .mono { font-size: .74rem; color: var(--muted); letter-spacing: .5px; }
    .firma-foot { width: 130px; flex: none; }
    .fav { font-style: normal; color: var(--legendary); }
    .op-foto { position: relative; margin-bottom: 10px; --k: 18px; background: var(--card); }
    .op-foto img { display: block; width: 100%; height: auto; }
    .op-foto figcaption { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 34px 18px 12px; background: linear-gradient(transparent, rgba(8,8,10,.9)); font-family: var(--hud); font-size: .7rem; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: #dddcdf; }
    .op-foto figcaption b { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1.5rem; letter-spacing: 0; color: var(--text); line-height: 1; }
    .about-rules { grid-column: 1 / -1; }
    .rules-title { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1.7rem; text-transform: uppercase; margin: 0 0 10px; }
    .rules { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    @media (max-width: 1000px) { .rules { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .rules { grid-template-columns: 1fr; } }
    .rule { --k: 10px; background: var(--card); padding: 12px 18px; }
    .rule b { display: block; font-family: var(--hud); font-size: .84rem; font-weight: 700; letter-spacing: .3px; color: var(--red-hi); }
    .rule span { color: var(--muted); font-size: .94rem; }
    .bars { padding: 0 24px 18px; display: grid; gap: 5px; }
    .bar-shield { height: 9px; background: var(--shield); -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(25% - 3px), transparent calc(25% - 3px) 25%); mask: repeating-linear-gradient(90deg, #000 0 calc(25% - 3px), transparent calc(25% - 3px) 25%); transform: skewX(-20deg); animation: fill 1.2s ease-out both; transform-origin: left; }
    .bar-health { height: 5px; background: var(--text); transform: skewX(-20deg); }
    @keyframes fill { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    .abilities { display: grid; border-top: 1px solid var(--line); }
    .ability { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 11px 24px; align-items: baseline; font-size: .93rem; }
    .ability + .ability { border-top: 1px solid var(--line); }
    .ability b { font-family: var(--hud); font-size: .7rem; letter-spacing: 1px; text-transform: uppercase; color: var(--c); }
    .ability span { color: #dddcdf; }

    .feed { margin-top: 14px; display: grid; gap: 5px; min-height: 124px; align-content: start; font-family: var(--hud); font-size: .82rem; font-weight: 600; }
    .feed div { justify-self: end; background: rgba(0,0,0,.72); padding: 4px 16px 4px 12px; clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%); animation: feedin .3s ease-out; max-width: 100%; }
    .feed i { font-style: normal; color: var(--red-hi); }
    .feed em { font-style: normal; color: var(--legendary); }
    @keyframes feedin { from { opacity: 0; transform: translateX(16px); } }
    @media (max-width: 960px) { .hero .wrap { grid-template-columns: 1fr; gap: 40px; } .hero { padding-top: 48px; } .hero::before { width: 90%; opacity: .5; } }

    /* ---------- STATS ---------- */
    .proof { background: var(--bg-2); border-block: 1px solid var(--line); }
    .proof .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
    .proof-item { padding: 24px 20px; position: relative; }
    .proof-item + .proof-item { border-left: 1px solid var(--line); }
    .proof-item small { display: block; font-family: var(--hud); font-size: .68rem; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
    .proof-item b { display: block; font-family: var(--display); font-style: italic; font-size: clamp(2.6rem, 5vw, 3.6rem); font-weight: 800; line-height: 1.05; color: var(--legendary); }
    .proof-item span { color: #cfced2; font-size: .95rem; }
    @media (max-width: 760px) {
      .proof .wrap { grid-template-columns: 1fr 1fr; }
      .proof-item:nth-child(3) { border-left: 0; }
      .proof-item:nth-child(n+3) { border-top: 1px solid var(--line); }
    }

    /* ---------- SECCIONES ---------- */
    section { padding: 92px 0; }
    .kicker { font-family: var(--hud); font-weight: 700; font-size: .8rem; color: var(--red-hi); letter-spacing: 1.6px; text-transform: uppercase; margin-bottom: 8px; }
    .kicker::before { content: "/// "; }
    h2 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: clamp(2.7rem, 6vw, 4.4rem); line-height: .95; text-transform: uppercase; }
    .head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 44px; }
    .head p { color: var(--muted); font-size: 1.08rem; max-width: 470px; }

    /* ---------- CARGAS ---------- */
    .loadout-sec { background: var(--bg-2); border-block: 1px solid var(--line); }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
    .tab { font-family: var(--hud); font-weight: 700; font-size: .84rem; letter-spacing: .6px; text-transform: uppercase; padding: 10px 22px; background: var(--card); color: var(--muted); clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); transition: background .15s, color .15s; }
    .tab small { color: inherit; opacity: .65; margin-right: 6px; font-size: .72rem; }
    .tab:hover { color: var(--text); background: var(--card-2); }
    .tab[aria-selected="true"] { background: var(--red); color: #fff; }
    .slots { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; }
    .slot { --k: 18px; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 20%, var(--card)) 0%, var(--card) 62%); padding: 20px 24px 22px; position: relative; display: grid; align-content: space-between; gap: 8px; min-height: 216px; animation: feedin .3s ease-out; }
    .slot::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--c); }
    .slot-label { display: flex; justify-content: space-between; gap: 10px; font-family: var(--hud); font-size: .72rem; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); }
    .slot-label b { color: var(--c); }
    .slot svg { width: min(100%, 300px); height: auto; justify-self: center; fill: var(--c); filter: drop-shadow(0 8px 18px color-mix(in srgb, var(--c) 40%, transparent)); }
    .slot h3 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 2.1rem; line-height: 1; text-transform: uppercase; }
    .attach { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 14px; }
    .att { background: var(--card); --k: 10px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: .95rem; line-height: 1.2; }
    .att i { flex: none; width: 24px; height: 27px; background: var(--c, var(--rare)); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
    .tested { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 18px; font-family: var(--hud); font-size: .78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .tested button { font-family: var(--hud); font-weight: 700; font-size: .8rem; padding: 5px 14px; background: var(--card-2); color: var(--text); clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); text-transform: uppercase; }
    .tested button:hover { background: var(--legendary); color: #111; }
    .inventory { margin-top: 40px; padding-top: 26px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
    .inventory h4 { font-family: var(--hud); font-size: .72rem; letter-spacing: 1.1px; text-transform: uppercase; color: var(--c); margin-bottom: 8px; }
    .inventory p { color: #cfced2; font-size: .94rem; }
    @media (max-width: 860px) { .slots { grid-template-columns: 1fr; } .attach { grid-template-columns: 1fr 1fr; } .inventory { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 460px) { .attach { grid-template-columns: 1fr; } .inventory { grid-template-columns: 1fr; } }

    /* ---------- PROYECTOS ---------- */
    .featured { display: grid; gap: 24px; }
    .feat { --k: 26px; display: grid; grid-template-columns: 1.1fr 1fr; background: var(--card); position: relative; }
    .feat::after, .card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--c); }
    .feat:nth-child(even) .feat-visual { order: 2; }
    .feat-visual { min-height: 380px; padding: 32px; display: grid; place-items: center; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 34%, var(--card-2)), var(--card-2) 62%); overflow: hidden; }
    .feat-body { padding: 36px 38px 40px; display: flex; flex-direction: column; gap: 15px; }
    .feat-body h3 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 3rem; line-height: 1; text-transform: uppercase; }
    .feat-body > p { color: #cfced2; }
    .feat-list { display: grid; gap: 8px; font-size: .97rem; }
    .feat-list li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; }
    .feat-list li::before { content: ""; width: 9px; height: 10px; margin-top: 8px; background: var(--c); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
    @media (max-width: 900px) {
      .feat { grid-template-columns: 1fr; }
      .feat:nth-child(even) .feat-visual { order: 0; }
      .feat-visual { min-height: 290px; padding: 22px; }
      .feat-body { padding: 26px 22px 32px; }
    }
    .apps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .app { --k: 9px; background: var(--card-2); padding: 10px 13px; }
    .app b { display: block; font-family: var(--hud); font-size: .78rem; letter-spacing: .3px; text-transform: uppercase; color: var(--c); }
    .app span { display: block; color: #c3c2c8; font-size: .86rem; line-height: 1.32; margin-top: 2px; }
    @media (max-width: 460px) { .apps { grid-template-columns: 1fr; } }
    .rarity { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; align-self: flex-start; justify-self: start; font-family: var(--hud); font-size: .72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .rarity b { background: var(--c); color: #0b0b0d; padding: 2px 12px 2px 8px; clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 100%, 0 100%); }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { font-family: var(--mono); font-size: .72rem; color: #c3c2c8; background: var(--bg); padding: 3px 8px; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
    .link { display: inline-flex; align-items: center; gap: 6px; font-family: var(--hud); font-size: .8rem; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 9px 20px; background: var(--card-2); clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); transition: background .15s, color .15s; }
    .link:hover { background: var(--c, var(--shield)); color: #0b0b0d; }
    .link.solid { background: var(--text); color: var(--bg); }
    .link.solid:hover { background: var(--c, var(--shield)); }
    .more-head { margin: 76px 0 24px; display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; }
    .more-head h3 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 2.4rem; line-height: 1; text-transform: uppercase; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter { font-family: var(--hud); font-weight: 600; font-size: .78rem; letter-spacing: .4px; text-transform: uppercase; padding: 8px 18px; background: var(--card); color: var(--muted); clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
    .filter:hover { color: var(--text); }
    .filter[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    @media (max-width: 1000px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    .card { --k: 18px; text-align: left; background: var(--card); display: flex; flex-direction: column; position: relative; transition: transform .2s, background .2s; animation: feedin .35s both; }
    .card:hover { transform: translateY(-5px); background: var(--card-2); }
    .card-visual { aspect-ratio: 16/10.5; display: grid; place-items: center; padding: 18px; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 38%, var(--card-2)), var(--card-2) 66%); overflow: hidden; position: relative; }
    .card-visual img, .m-visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
    .card-body h4 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1.8rem; line-height: 1.02; text-transform: uppercase; overflow-wrap: anywhere; }
    .card-body p { color: #bdbcc2; font-size: .95rem; flex: 1; }
    .card-cta { font-family: var(--hud); font-weight: 700; font-size: .78rem; letter-spacing: .5px; text-transform: uppercase; color: var(--c); margin-top: 4px; }

    /* ---------- MOCKUPS (decorativos) ---------- */
    .mk { width: 100%; max-width: 440px; font-family: var(--sans); color: #e9e8ef; font-size: 10px; line-height: 1.3; pointer-events: none; user-select: none; }
    .win { background: #101016; border: 1px solid #2c2b38; border-radius: 8px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(0,0,0,.9); }
    .win-bar { display: flex; gap: 5px; padding: 8px 10px; border-bottom: 1px solid #24232f; align-items: center; }
    .win-bar i { width: 7px; height: 7px; border-radius: 50%; background: #3a3948; }
    .win-bar u { text-decoration: none; margin-left: 10px; flex: 1; max-width: 60%; height: 14px; border-radius: 4px; background: #1d1c27; font-size: 8px; color: #8d8b9b; padding: 0 8px; line-height: 14px; overflow: hidden; white-space: nowrap; }
    .row { display: flex; gap: 8px; } .col { display: flex; flex-direction: column; gap: 6px; }
    .bar { height: 6px; border-radius: 3px; background: #2a2936; }
    .chip { font-size: 8px; padding: 2px 6px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
    .phone { width: 172px; background: #101016; border: 5px solid #26252f; border-radius: 26px; overflow: hidden; box-shadow: 0 30px 60px -25px rgba(0,0,0,.9); position: relative; }
    .phone::before { content: ""; position: absolute; top: 6px; left: 50%; translate: -50% 0; width: 46px; height: 12px; border-radius: 8px; background: #000; z-index: 2; }
    .card-visual .mk { zoom: .7; }
    .m-visual .mk { zoom: .85; }
    @media (max-width: 420px) { .feat-visual .mk { zoom: .82; } }
    .float { animation: float 7s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px); } }

    /* ---------- HABILIDADES ---------- */
    .perfil-sec { padding-bottom: 40px; }
    .perfil { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .perfil-c { --k: 16px; background: var(--card); padding: 26px; display: flex; flex-direction: column; gap: 10px; }
    .perfil-c .num { font-family: var(--hud); font-weight: 700; font-size: .78rem; color: var(--red-hi); letter-spacing: 1px; }
    .perfil-c h3 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1.85rem; line-height: 1.02; text-transform: uppercase; }
    .perfil-c p { color: #cfced2; flex: 1; }
    .prueba { border-top: 1px solid var(--line); padding-top: 12px; font-size: .94rem; color: var(--muted); }
    .prueba b { display: block; font-family: var(--hud); font-size: .68rem; letter-spacing: 1.1px; text-transform: uppercase; color: var(--legendary); margin-bottom: 2px; }
    .perfil-datos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 14px; background: var(--line); border: 1px solid var(--line); }
    .perfil-datos > div { background: var(--bg-2); padding: 14px 18px; }
    .perfil-datos small { display: block; font-family: var(--hud); font-size: .68rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .perfil-datos b { font-weight: 600; }
    @media (max-width: 900px) { .perfil { grid-template-columns: 1fr; } .perfil-datos { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { .perfil-datos { grid-template-columns: 1fr; } }

    .ia-sec { background: var(--bg-2); border-block: 1px solid var(--line); }
    .ia-casos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .ia-caso { --k: 18px; background: var(--card); display: flex; flex-direction: column; }
    .ia-visual { position: relative; aspect-ratio: 16/8.6; display: grid; place-items: center; padding: 34px 18px 16px; overflow: hidden; background: linear-gradient(150deg, color-mix(in srgb, var(--red) 30%, var(--card-2)), var(--card-2) 68%); }
    .ia-visual.es-foto { padding: 34px 16px 12px; }
    .ia-visual img { width: 100%; height: 100%; object-fit: contain; display: block; min-height: 0; }
    .ia-visual .mk { zoom: .82; }
    .ia-marca { position: absolute; top: 10px; left: 12px; z-index: 1; font-family: var(--hud); font-size: .64rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; background: rgba(8,8,10,.8); color: var(--muted); }
    .ia-marca.real { color: var(--green); }
    .ia-texto { padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; flex: 1; }
    .ia-tag { font-family: var(--hud); font-size: .7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--legendary); }
    .ia-texto h3 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1.9rem; line-height: 1.02; text-transform: uppercase; }
    .ia-par small { display: block; font-family: var(--hud); font-size: .68rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 1px; }
    .ia-par p { color: #bdbcc2; font-size: .98rem; }
    .ia-par.con small { color: var(--red-hi); }
    .ia-par.con p { color: var(--text); }
    .ia-caso .card-cta { background: none; border: 0; padding: 0; cursor: pointer; color: var(--red-hi); margin-top: auto; padding-top: 6px; }
    .ia-mk { display: grid; grid-template-columns: 1fr auto 1.1fr; gap: 12px; align-items: center; }
    .ia-papel { background: #f3f2ee; color: #1b1b20; padding: 14px; display: grid; gap: 5px; transform: rotate(-2deg); font-size: 11px; }
    .ia-papel b { font-size: 12px; }
    .ia-papel i { display: block; height: 4px; background: #c9c8c4; }
    .ia-flecha { font-size: 22px; color: var(--red-hi); }
    .ia-json { background: #0d0d10; border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 5px; font-family: var(--mono); font-size: 11px; color: var(--green); }
    .ia-json small { display: block; color: var(--muted); font-size: 9px; }
    .ia-chat { display: grid; gap: 7px; max-width: 340px; font-size: 12px; }
    .ia-chat .yo { justify-self: end; background: var(--red); color: #fff; padding: 8px 12px; border-radius: 12px 12px 2px 12px; }
    .ia-chat .bot { justify-self: start; background: #2a2a32; padding: 8px 12px; border-radius: 12px 12px 12px 2px; }
    .ia-chat .prod { display: grid; grid-template-columns: 42px 1fr; gap: 10px; align-items: center; background: #15151a; border: 1px solid var(--line); padding: 8px; }
    .ia-chat .foto { height: 42px; background: linear-gradient(135deg, #ffb81c, #e02a22); }
    .ia-chat .prod small { display: block; color: var(--green); font-size: 11px; }
    .ia-reglas-t, .svc-todo { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1.7rem; text-transform: uppercase; margin: 36px 0 12px; }
    .ia-reglas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ia-reglas > div { --k: 10px; background: var(--card); padding: 14px 18px; }
    .ia-reglas b { display: block; font-family: var(--hud); font-size: .86rem; font-weight: 700; }
    .ia-reglas span { color: var(--muted); font-size: .95rem; }
    .ia-cta { --k: 18px; margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; padding: 26px 30px; background: linear-gradient(120deg, color-mix(in srgb, var(--red) 42%, var(--card)), var(--card) 72%); }
    .ia-cta h3 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 2.1rem; line-height: 1.02; text-transform: uppercase; }
    .ia-cta p { color: #dddcdf; max-width: 620px; }
    @media (max-width: 860px) { .ia-casos, .ia-reglas { grid-template-columns: 1fr; } }
    @media (max-width: 420px) { .ia-visual .mk { zoom: .9; } .ia-visual { aspect-ratio: 16/11.5; padding-inline: 12px; } .ia-mk { gap: 8px; } }

    .puertas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .puerta { --k: 18px; background: var(--card); padding: 28px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .puerta small { font-family: var(--hud); font-size: .72rem; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--red-hi); }
    .puerta h3 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 2.3rem; line-height: 1; text-transform: uppercase; }
    .puerta p { color: #cfced2; }
    .puerta ul { list-style: none; display: grid; gap: 4px; margin-bottom: 8px; flex: 1; align-content: start; color: #dddcdf; font-size: .96rem; }
    .puerta li::before { content: "» "; color: var(--red-hi); }
    @media (max-width: 760px) { .puertas { grid-template-columns: 1fr; } }
    .services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .service { --k: 16px; background: var(--card); padding: 26px 26px 28px; display: flex; flex-direction: column; gap: 10px; transition: background .2s; }
    .service:hover { background: var(--card-2); }
    .service .num { display: flex; align-items: center; gap: 10px; font-family: var(--hud); font-weight: 700; font-size: .72rem; letter-spacing: 1px; text-transform: uppercase; color: var(--c); }
    .service .num kbd { font-family: var(--hud); font-size: .86rem; width: 28px; height: 28px; display: grid; place-items: center; color: #0b0b0d; background: var(--c); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
    .service h3 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1.85rem; line-height: 1.02; text-transform: uppercase; }
    .service p { color: #bdbcc2; font-size: .96rem; }
    .service ul { display: grid; gap: 4px; margin-top: 4px; font-size: .92rem; }
    .service li { display: flex; gap: 8px; } .service li::before { content: "+"; color: var(--c); font-weight: 700; }
    @media (max-width: 960px) { .services { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px) { .services { grid-template-columns: 1fr; } }

    /* ---------- OPERADOR ---------- */
    .about { display: grid; grid-template-columns: 1.1fr .9fr; gap: 52px; align-items: start; }
    .about-text p { color: #cfced2; font-size: 1.08rem; margin-top: 16px; }
    .about-text p strong { color: var(--text); font-weight: 600; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fact { --k: 10px; background: var(--card); padding: 14px 18px; }
    .fact:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .fact small { display: block; font-family: var(--hud); color: var(--muted); font-size: .7rem; letter-spacing: 1px; text-transform: uppercase; }
    .fact b { font-weight: 600; }
    .learning { margin-top: 18px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-family: var(--hud); font-size: .74rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--shield); }
    @media (max-width: 900px) { .about { grid-template-columns: 1fr; gap: 34px; } }

    /* ---------- FASES ---------- */
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; counter-reset: s; }
    .step { padding: 22px 26px 24px 0; border-top: 3px solid var(--line); position: relative; }
    .step::before { content: ""; position: absolute; top: -3px; left: 0; width: 42%; height: 3px; background: var(--red-hi); }
    .step b { font-family: var(--hud); color: var(--red-hi); font-size: .74rem; letter-spacing: 1.1px; text-transform: uppercase; }
    .step h3 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1.9rem; line-height: 1.05; margin: 4px 0 6px; text-transform: uppercase; }
    .step p { color: #bdbcc2; font-size: .95rem; }
    @media (max-width: 960px) { .steps { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }

    /* ---------- ESCUADRÓN ---------- */
    .contact { --k: 30px; position: relative; padding: clamp(36px, 6vw, 68px) clamp(22px, 5vw, 60px); background: linear-gradient(120deg, #6d100c, var(--card) 62%); }
    .contact h2 { max-width: 760px; font-size: clamp(2.9rem, 7vw, 5.2rem); }
    .contact .kicker { color: #ffd2cd; }
    .contact > p { color: #e4e3e6; font-size: 1.12rem; max-width: 560px; margin: 16px 0 26px; }
    .squad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 26px; max-width: 760px; }
    .squad > div { --k: 12px; background: rgba(0,0,0,.5); padding: 14px 16px; }
    .squad small { display: block; font-family: var(--hud); font-size: .68rem; letter-spacing: 1px; text-transform: uppercase; color: var(--green); }
    .squad b { font-family: var(--display); font-style: italic; font-size: 1.55rem; font-weight: 800; text-transform: uppercase; line-height: 1.1; }
    .squad .open small { color: var(--legendary); animation: pulse 1.6s infinite; }
    .contact-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .copy { position: relative; overflow: visible; }
    .copy.done { background: var(--green); color: #0b0b0d; }
    .socials { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 30px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.14); }
    @media (max-width: 560px) { .squad { grid-template-columns: 1fr; } }

    footer { padding: 30px 0 42px; color: var(--muted); font-size: .88rem; }
    footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
    footer .mono { font-size: .78rem; }

    /* ---------- MODAL ---------- */
    dialog { margin: auto; width: min(760px, 100% - 24px); max-height: calc(100dvh - 32px); border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 0; overflow: auto; }
    dialog::backdrop { background: rgba(0,0,0,.78); }
    dialog[open] { animation: feedin .22s ease-out; }
    .m-visual { aspect-ratio: 16/10; display: grid; place-items: center; padding: 22px; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 38%, var(--card-2)), var(--card-2) 66%); position: relative; overflow: hidden; }
    .card-visual img, .feat-visual img { object-position: top; }
    .card-visual img.whole { inset: 16px; width: calc(100% - 32px); height: calc(100% - 32px); object-fit: contain; object-position: center; }
    .feat-visual { position: relative; }
    .feat-visual img { display: block; width: 100%; height: auto; border: 1px solid #34343e; box-shadow: 0 30px 60px -24px rgba(0,0,0,.95); transition: transform .3s; }
    .feat-visual:has(.shots) { align-content: center; gap: 16px; }
    .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
    .feat-visual .shots img { aspect-ratio: 9/14; object-fit: cover; object-position: top; border-radius: 12px; }
    .shots.wide { grid-template-columns: 1fr 1fr; }
    .feat-visual .shots.wide img { aspect-ratio: 16/10; border-radius: 0; }
    .m-visual img { object-fit: contain; background: #000; }
    .m-thumbs { display: flex; gap: 6px; padding: 8px 8px 0; overflow-x: auto; }
    .m-thumbs:empty { display: none; }
    .m-thumb { flex: 0 0 96px; aspect-ratio: 16/8; opacity: .55; border-bottom: 3px solid transparent; transition: opacity .15s; }
    .m-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .m-thumb:hover { opacity: .85; }
    .m-thumb[aria-pressed="true"] { opacity: 1; border-color: var(--c); }
    .m-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; background: var(--bg); font-size: 1.05rem; z-index: 2; }
    .m-close:hover { background: var(--red); }
    .m-body { padding: 26px 32px 34px; display: grid; gap: 15px; }
    .m-body h3 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 2.9rem; line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
    .m-body > p { color: #cfced2; font-size: 1.04rem; }
    .m-body h4 { font-family: var(--hud); font-size: .74rem; letter-spacing: 1.1px; color: var(--c); text-transform: uppercase; }
    @media (max-width: 560px) { .m-body { padding: 22px 20px 28px; } .m-visual { aspect-ratio: 4/5; padding: 14px; } }

    /* ---------- REVEAL ---------- */
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity .55s ease-out, transform .55s ease-out; }
    .reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { opacity: 1; transform: none; transition: none; }
      .float, .pulse, .card, .feed div, .slot, .bar-shield, .squad .open small { animation: none; }
    }
  </style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="wrap">
    <a href="#top" class="brand" aria-label="Inicio"><span id="brandName"></span></a>
    <div class="menu" id="menu">
      <a href="#perfil" data-t="nav.profile"></a>
      <a href="#proyectos" data-t="nav.projects"></a>
      <a href="#ia" data-t="nav.ai"></a>
      <a href="#servicios" data-t="nav.services"></a>
      <a href="#sobre-mi" data-t="nav.about"></a>
    </div>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button data-lang="es" aria-pressed="true">ES</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
    <a href="#contacto" class="btn btn-primary btn-sm nav-cta" data-t="nav.cta"></a>
    <button class="burger" id="burger" aria-label="Menú" aria-expanded="false" aria-controls="menu"><span></span></button>
  </div>
  <div class="shield-bar" id="shieldBar"></div>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <div>
      <div class="status"><span class="pulse"></span><span data-t="hero.status"></span></div>
      <h1><span data-t="hero.title1"></span> <span class="hl" data-t="hero.title2"></span></h1>
      <p class="hero-sub" data-t-html="hero.sub"></p>
      <div class="hero-actions">
        <a href="#contacto" class="btn btn-primary" data-t="hero.cta1"></a>
        <a href="#proyectos" class="btn btn-ghost" data-t="hero.cta2"></a>
      </div>
    </div>
    <div>
      <div class="op cut">
        <div class="op-top">
          <div class="op-emblem" aria-hidden="true"><img src="img/clizco-avatar.webp" alt="" /></div>
          <div>
            <div class="op-label" data-t="op.label"></div>
            <div class="op-name">Clizco</div>
            <div class="op-real">Abraham Gonzalez</div>
            <div class="op-class" data-t="op.class"></div>
          </div>
        </div>
        <div class="bars" aria-hidden="true"><div class="bar-shield"></div><div class="bar-health"></div></div>
        <div class="abilities" id="abilities"></div>
        <div class="op-firma"><div class="firma reveal" data-firma></div></div>
      </div>
      <div class="feed" id="feed" aria-hidden="true"></div>
    </div>
  </div>
</header>

<div class="proof"><div class="wrap" id="proof"></div></div>

<section id="perfil" class="perfil-sec">
  <div class="wrap">
    <div class="head reveal">
      <div>
        <div class="kicker" data-t="profile.kicker"></div>
        <h2 data-t="profile.title"></h2>
      </div>
      <p data-t="profile.sub"></p>
    </div>
    <div class="perfil" id="perfilCards"></div>
    <div class="perfil-datos reveal" id="perfilDatos"></div>
  </div>
</section>

<section id="proyectos">
  <div class="wrap">
    <div class="head reveal">
      <div>
        <div class="kicker" data-t="work.kicker"></div>
        <h2 data-t="work.title"></h2>
      </div>
      <p data-t="work.sub"></p>
    </div>
    <div class="featured" id="featured"></div>
    <div class="more-head reveal">
      <h3 data-t="work.more"></h3>
      <div class="filters" id="filters" role="group" aria-label="Filtrar proyectos"></div>
    </div>
    <div class="grid" id="grid"></div>
